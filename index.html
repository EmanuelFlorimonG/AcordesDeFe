<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acordes de Fe | Cancionero Joven & Acordes</title>

    <!-- Instalable como aplicación: el manifiesto dice cómo se llama, con qué
         icono y de qué color se abre. El azul es el del propio icono. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="El cancionero del Ministerio Acordes de Fe: letras, acordes y los Setlists de cada celebración." />

    <!-- iOS no lee el manifiesto: lo suyo se dice aparte. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Acordes de Fe" />
    <!-- Inter y JetBrains Mono van dentro de la aplicación (ver index.css),
         para que la letra y los acordes se vean igual sin conexión. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin-400-normal.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin-600-normal.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="/fonts/jetbrains-mono-latin-700-normal.woff2" crossorigin>
  </head>
  <body class="bg-white text-slate-900 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
